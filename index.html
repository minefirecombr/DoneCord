<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11131b">
  <title>Discord Chat Pro</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="auth" class="auth-screen">
    <section class="auth-card">
      <div class="brand-mark">D</div>
      <h1>Discord Chat Pro</h1>
      <p>Entre para conversar com sua comunidade.</p>
      <label>E-mail <input id="email" type="email" autocomplete="email" placeholder="voce@email.com"></label>
      <label>Senha <input id="password" type="password" autocomplete="current-password" placeholder="Mínimo de 6 caracteres"></label>
      <div class="auth-actions">
        <button id="loginBtn">Entrar</button><button id="registerBtn" class="secondary">Criar conta</button>
      </div>
      <button id="anonymousBtn" class="ghost">Continuar anonimamente</button>
      <p id="authError" class="error" role="alert"></p>
    </section>
  </div>

  <div id="app" class="app hidden">
    <aside class="servers-rail">
      <div class="brand-mark small">D</div>
      <div id="serverList" class="server-list"></div>
      <button id="createServerBtn" class="server-add" title="Criar servidor">+</button>
    </aside>
    <aside id="channelSidebar" class="channel-sidebar">
      <header class="sidebar-header"><strong id="serverTitle">Mensagens</strong><button id="serverMenuBtn" class="icon-btn" title="Opções">•••</button></header>
      <div class="sidebar-scroll">
        <div class="section-label">CANAIS DE TEXTO</div>
        <div id="textChannels"></div>
        <div class="section-label">CANAIS DE VOZ</div>
        <div id="voiceChannels"></div>
        <button id="createChannelBtn" class="add-channel">＋ Criar canal</button>
        <div class="section-label">MENSAGENS DIRETAS</div>
        <div id="dmList"></div>
      </div>
      <footer class="user-panel">
        <div class="avatar" id="myAvatar">?</div>
        <div class="user-meta"><strong id="myName">Usuário</strong><small id="myStatus">Conectado</small></div>
        <button id="profileBtn" class="icon-btn" title="Perfil">⚙</button>
        <button id="logoutBtn" class="icon-btn" title="Sair">↪</button>
      </footer>
    </aside>
    <main class="chat-area">
      <header class="chat-header">
        <button id="mobileMenuBtn" class="icon-btn mobile-only">☰</button>
        <span class="hash">#</span><strong id="channelTitle">geral</strong>
        <span id="connectionState" class="connection-state">Conectando…</span>
        <div class="header-actions"><button id="membersToggle" class="icon-btn" title="Membros">♙</button></div>
      </header>
      <section id="messages" class="messages">
        <div class="welcome"><div class="welcome-icon">✦</div><h2>Bem-vindo ao canal!</h2><p>Este é o começo desta conversa.</p></div>
      </section>
      <form id="messageForm" class="composer">
        <label class="attach-btn" title="Enviar imagem/arquivo">＋<input id="fileInput" type="file" hidden></label>
        <input id="messageInput" maxlength="4000" autocomplete="off" placeholder="Enviar mensagem…" aria-label="Mensagem">
        <button type="button" id="emojiBtn" class="icon-btn" title="Inserir emoji">☺</button>
        <button type="submit" class="send-btn">Enviar</button>
      </form>
      <div id="uploadStatus" class="upload-status"></div>
    </main>
    <aside id="membersPanel" class="members-panel">
      <div class="section-label">MEMBROS</div>
      <div id="memberList"></div>
    </aside>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-card" id="modalForm">
      <button class="modal-close" value="cancel" aria-label="Fechar">×</button>
      <h2 id="modalTitle">Criar servidor</h2>
      <div id="modalBody"></div>
      <div class="modal-actions"><button value="cancel" class="secondary">Cancelar</button><button id="modalSubmit" value="default">Confirmar</button></div>
    </form>
  </dialog>

  <section id="callDock" class="call-dock hidden">
    <div class="call-top"><strong id="callTitle">Chamada</strong><span id="callStatus">Conectando</span></div>
    <div id="callVideos" class="call-videos"><video id="localVideo" autoplay muted playsinline></video></div>
    <div class="call-controls">
      <button id="micBtn">🎙 Microfone</button><button id="cameraBtn">📷 Câmera</button>
      <button id="screenBtn">▣ Compartilhar tela</button><button id="hangupBtn" class="danger">Encerrar</button>
    </div>
  </section>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
